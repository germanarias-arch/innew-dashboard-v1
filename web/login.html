  <script>
    function onLogin(resp) {
      document.getElementById("msg").textContent = "Verificando…";
      fetch("/api/auth", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include",
        body: JSON.stringify({ credential: resp.credential })
